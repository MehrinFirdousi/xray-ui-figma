<!-- ui.html -->
<!DOCTYPE html>
<html>
<head>
  <title>X-ray UI</title>
  <style>
    body {
      font-family: Arial, sans-serif; 
      padding: 16px; 
    }
    h2 {
      text-align: center; /* Center the h2 element */
    }
    #result { 
      margin-top: 16px; 
    }
    .button-container {
      display: flex;
      justify-content: center; /* Center horizontally */
      margin-top: 16px; /* Add some space above the button */
    }
    #analyze {
      background-color: #4CAF50; /* Green background */
      color: white; /* White text */
      padding: 12px 24px; /* More padding */
      border: none; /* Remove border */
      border-radius: 4px; /* Rounded corners */
      cursor: pointer; /* Pointer cursor on hover */
      font-size: 16px; /* Larger font size */
      align-items: center;
    }
    #analyze:hover {
      background-color: #45a049; /* Darker green on hover */
    }
  </style>
</head>
<body>
  <h2>UI Analyzer</h2>
  <div class="button-container">
    <button id="analyze">Analyze Selected Frames</button>
  </div>
  <div id="result"></div>
  <script>
    // Function to send analyze frames message
    const analyzeSelectedFrames = () => {
      parent.postMessage({ pluginMessage: { type: 'analyze-frames' } }, '*');
    };

    // Run analyzer on launch
    analyzeSelectedFrames();

    // Send a message to the plugin code when the button is clicked
    document.getElementById('analyze').onclick = () => {
      analyzeSelectedFrames();
    };

    // Receive and display the results dynamically
    window.onmessage = event => {
      const message = event.data.pluginMessage;
      if (message.type === 'analysis-result') {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = ''; // Clear previous results

        delete message.type;

        // Loop through each key in the message and add a line to the result display
        for (const key in message) {
          const line = document.createElement('p');
          line.textContent = `${capitalizeFirstLetter(key)}: ${message[key]}`;
          resultDiv.appendChild(line);
        }
      }
    };

    // Utility function to capitalize the first letter of a string
    function capitalizeFirstLetter(string) {
      return string.charAt(0).toUpperCase() + string.slice(1);
    }
    
  </script>
</body>
</html>
